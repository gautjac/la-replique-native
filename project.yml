name: LaReplique
options:
  bundleIdPrefix: app.atelier
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: fr

# Bilingual FR + EN. fr is the development/fallback language.
knownRegions:
  - fr
  - en
  - Base

# Vendored ClaudeKit (in-repo, self-contained) so Xcode Cloud — which clones only
# this repo — can build without the sibling ../atelier-kit local package.
# Canonical source stays ~/Claude/apps/atelier-kit; see Vendor/ClaudeKit/PROVENANCE.md.
packages:
  ClaudeKit:
    path: Vendor/ClaudeKit
  # Shared (collaborative) plays sync through Firestore; sign-in through Firebase Auth.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9WZ66DZ69J"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LaReplique:
    type: application
    # One multiplatform target → a single universal app, native on iOS
    # (iPhone/iPad) and macOS (AppKit-backed SwiftUI, NOT Catalyst).
    # Module named `LaReplique` — `Replique` alone risks symbol collisions.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Sources
      # The Atelier's craft corpus (screenwriting skills, Chinese-bodied markdown)
      # as a folder reference → copied verbatim into the bundle as Resources/Corpus/.
      # Source of truth is the web app; `npm run corpus:sync` there mirrors it here.
      - path: Corpus
        type: folder
        buildPhase: resources
    dependencies:
      - package: ClaudeKit
        product: ClaudeKit
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: La Réplique
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - fr
          - en
        LSApplicationCategoryType: public.app-category.productivity
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # The Firebase emulator on a developer Mac is plain HTTP on the loopback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google sign-in returns to the app through this scheme (REVERSED_CLIENT_ID
        # of GoogleService-Info.plist).
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["com.googleusercontent.apps.404912464373-9jkbcisjm27608tkfdif1hf6mkioojap"]
        # Storyboard-free launch screen (iOS 14+). Required so the app is treated
        # as supporting all iPad sizes; without it App Store delivery prep fails.
        # Charcoal "desk" background so the launch reads as intentional.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atelier.lareplique
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
      # Per-SDK AND per-config entitlements. macOS carries the App Sandbox + file
      # access; both platforms carry iCloud/CloudKit + network. The ONLY per-config
      # difference is aps-environment: Debug=development, Release=production — a
      # Release build with development APS silently breaks CloudKit push (and thus
      # SwiftData cross-device sync) on TestFlight/App Store.
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Resources/macOS.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Sources/Resources/iOS.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sources/Resources/iOS.entitlements
        Release:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Resources/macOS-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Sources/Resources/iOS-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sources/Resources/iOS-Release.entitlements

  LaRepliqueTests:
    type: bundle.unit-test
    # Pure-logic tests: la-replique/1 JSON import/export round-trip, parser.
    # Multiplatform so they run on the Mac with no simulator boot.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: LaReplique
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atelier.lareplique.tests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/LaReplique.app/Contents/MacOS/LaReplique"

schemes:
  LaReplique:
    build:
      targets:
        LaReplique: all
        LaRepliqueTests: [test]
    test:
      targets:
        - LaRepliqueTests
